name: Setup
description: pnpm, Node, and a frozen install of the workspace
inputs:
  node-version:
    description: Node version to install
    default: '22'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: make install
      shell: bash
