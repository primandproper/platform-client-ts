# The generated client is committed, so the job here is proving it is what the pinned
# platform-go tag actually produces — not regenerating it on the fly. A drifted commit and
# a stale pin look identical to a consumer until something fails at runtime.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "33.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Built package imports from plain Node
        run: pnpm run check-build

      - name: Formatting
        run: pnpm exec prettier --check 'src/**/*.ts' '*.json' '*.md'

      # Regenerating must reproduce exactly what is committed. This catches a hand-edited
      # generated file, a pin that was bumped without regenerating, and a regeneration that
      # was never committed — three ways for the checked-in client to stop describing the
      # server.
      - name: Generated client matches the pinned tag
        run: |
          pnpm run codegen
          pnpm exec prettier --write 'src/generated/**/*.ts' >/dev/null
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated does not match what $(cat PLATFORM_GO_VERSION) generates. Run 'pnpm run codegen'."
            exit 1
          }
